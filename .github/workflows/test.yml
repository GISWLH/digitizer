name: Tests and accuracy gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev,pdf]'
      - run: python -m pytest -q
      - run: python scripts/benchmark.py --ablation --require-90
      - run: python scripts/validate_paper.py
      - run: python scripts/validate_flux.py --cases f04 --require-90
      - run: python scripts/validate_flux.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-evidence
          path: runs/
